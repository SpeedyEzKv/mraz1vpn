# Всё приложение: docker compose up -d --build
# Секреты — только в .env рядом с этим файлом (в git не попадает).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mraz1vpn
    # Настройки под сервер с 2 ГБ памяти.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mraz1vpn"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  # Одноразовый: создаёт роли и применяет миграции. Только у него есть пароль администратора БД.
  migrate:
    build: ./server
    command: ["node", "dist/db/migrate.js"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/mraz1vpn
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      BOT_MODE: webhook
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET}
      ADMIN_IDS: ${ADMIN_IDS}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_DATABASE_URL: postgres://mraz_app:${APP_DB_PASSWORD}@db:5432/mraz1vpn
      SYSTEM_DATABASE_URL: postgres://mraz_system:${SYSTEM_DB_PASSWORD}@db:5432/mraz1vpn
      XUI_URL: http://xui:2053/${XUI_BASE_PATH}/
      XUI_API_TOKEN: ${XUI_API_TOKEN}
      REALITY_TARGET: caddy:8443
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      CRYPTOBOT_TESTNET: ${CRYPTOBOT_TESTNET:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      xui:
        condition: service_started
    mem_limit: 384m
    logging: *logging

  # Xray (VLESS Reality) + панель 3x-ui. Порт 443 — у Xray: VPN-клиентов он обслуживает сам,
  # всё остальное (браузер, Telegram) прозрачно передаёт в Caddy:8443.
  # Панель наружу не открыта: только 127.0.0.1 сервера, заходить через SSH-туннель (см. README).
  xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.9.0
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      # Лимит устройств (limitIp) банит лишние IP через fail2ban — нужны NET_ADMIN и NET_RAW.
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_MEMORY_LIMIT: "300"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "443:443"
      - "127.0.0.1:2053:2053"
    volumes:
      - xui_db:/etc/x-ui
    mem_limit: 384m
    logging: *logging

  # Сайт и mini app. Слушает 8443 внутри сети Docker (сюда Xray отдаёт не-VPN трафик)
  # и 80 снаружи — для сертификата Let's Encrypt и редиректа на https.
  caddy:
    build: ./web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  xui_db:
  caddy_data:
  caddy_config:
